[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8 = 16MB flash + 8MB PSRAM ottale
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  ; se il monitor seriale resta vuoto, prova ad attivare questa riga:
  ; -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  lovyan03/LovyanGFX
  https://github.com/bitbank2/JPEGDEC.git#1.3.1